# Kafka for one product. Copy this file into your product folder as compose.yaml.
#
#   docker compose up -d                  one Kafka broker (KRaft mode, no ZooKeeper)
#   docker compose --profile cdc up -d    the broker and Kafka Connect with Debezium (change data capture)
#   docker compose down                   stop it; topics and messages stay in the volume
#
# Addresses of the broker:
#   localhost:9092   from your laptop, and from inside the kafka container
#   kafka:19092      from other containers of this Compose project (for example Spark)
#
# Kafka and Spark together (P8): copy ../spark/compose.yaml next to this file as compose.spark.yaml,
# then put these two lines at the top of this file (README.md explains):
#   include:
#     - compose.spark.yaml

services:
  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: de-kit-kafka-lab-01xyz                 # any 22 characters; fixed so the volume can be reused
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"           # you create every topic yourself
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1          # one broker, so one copy of everything
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m                 # keeps the broker near 600 MB
      # Kafka's scripts (kafka-topics.sh and the others) on the PATH inside the container.
      PATH: /opt/kafka/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # Kafka Connect with the Debezium connectors. Its REST API is on http://localhost:8083.
  connect:
    image: quay.io/debezium/connect:3.7.1.Final
    profiles: ["cdc"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Plain JSON messages: each change event holds before, after, op and source, without a schema block.
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      HEAP_OPTS: -Xms256m -Xmx512m
    extra_hosts:
      - "host.docker.internal:host-gateway"   # the data lab's PostgreSQL is host.docker.internal:5432

volumes:
  kafka-data:
